<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3a2a5c"/>
      <stop offset="45%" stop-color="#221836"/>
      <stop offset="100%" stop-color="#0d0a16"/>
    </radialGradient>

    <!-- Shield -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="55%" stop-color="#3c2513"/>
      <stop offset="100%" stop-color="#22150a"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d4a2c"/>
      <stop offset="100%" stop-color="#2c1c10"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5dd97"/>
      <stop offset="45%" stop-color="#caa03c"/>
      <stop offset="100%" stop-color="#7c5a1c"/>
    </linearGradient>

    <!-- Sword -->
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7d8291"/>
      <stop offset="45%" stop-color="#f1f2f5"/>
      <stop offset="55%" stop-color="#f1f2f5"/>
      <stop offset="100%" stop-color="#7d8291"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1b10"/>
      <stop offset="50%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1b10"/>
    </linearGradient>
    <radialGradient id="gem" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8f8f"/>
      <stop offset="55%" stop-color="#9c1c1c"/>
      <stop offset="100%" stop-color="#5c0f0f"/>
    </radialGradient>

    <!-- Staff -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2414"/>
      <stop offset="50%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#3a2414"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bfeaff"/>
      <stop offset="75%" stop-color="#5aa9d6"/>
      <stop offset="100%" stop-color="#2c6a90"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8fd8ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App icon background (squircle) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGlow)"/>

  <!-- Shield -->
  <g filter="url(#dropShadow)">
    <path d="M282,258 L742,258 C742,486 698,632 512,878 C326,632 282,486 282,258 Z"
          fill="url(#goldRim)"/>
    <path d="M300,278 L724,278 C724,492 684,624 512,850 C340,624 300,492 300,278 Z"
          fill="url(#shieldFill)"/>
    <path d="M328,304 L696,304 C696,498 660,610 512,812 C364,610 328,498 328,304 Z"
          fill="url(#shieldInner)" opacity="0.55"/>
  </g>

  <!-- Glow behind crossed weapons -->
  <circle cx="512" cy="540" r="230" fill="url(#orbGlow)" opacity="0.5" filter="url(#softBlur)"/>

  <!-- Staff (rotated to go from lower-right to upper-left) -->
  <g transform="translate(512 540) scale(0.88) translate(-512 -540) rotate(-42 512 540)" filter="url(#dropShadow)">
    <path d="M501,260 L523,260 L525,915 L499,915 Z" fill="url(#wood)"/>
    <path d="M503,270 C476,236 466,196 478,150" fill="none" stroke="url(#wood)" stroke-width="16" stroke-linecap="round"/>
    <path d="M521,270 C548,236 558,196 546,150" fill="none" stroke="url(#wood)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="512" cy="140" r="68" fill="url(#orbGlow)"/>
    <circle cx="512" cy="140" r="40" fill="url(#orb)"/>
  </g>

  <!-- Sword (rotated to go from lower-left to upper-right) -->
  <g transform="translate(512 540) scale(0.88) translate(-512 -540) rotate(42 512 540)" filter="url(#dropShadow)">
    <polygon points="512,140 533,252 491,252" fill="url(#steel)"/>
    <rect x="491" y="252" width="42" height="428" fill="url(#steel)"/>
    <rect x="507" y="252" width="10" height="428" fill="#ffffff" opacity="0.55"/>
    <rect x="424" y="680" width="176" height="36" rx="10" fill="url(#goldRim)"/>
    <rect x="491" y="716" width="42" height="112" fill="url(#grip)"/>
    <rect x="491" y="736" width="42" height="6" fill="#1a1108" opacity="0.6"/>
    <rect x="491" y="756" width="42" height="6" fill="#1a1108" opacity="0.6"/>
    <rect x="491" y="776" width="42" height="6" fill="#1a1108" opacity="0.6"/>
    <rect x="491" y="796" width="42" height="6" fill="#1a1108" opacity="0.6"/>
    <circle cx="512" cy="858" r="34" fill="url(#goldRim)"/>
    <circle cx="512" cy="858" r="14" fill="url(#gem)"/>
  </g>
</svg>
