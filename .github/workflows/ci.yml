name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Format (dart format)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      - name: Tests unitaires et widgets
        run: flutter test --coverage

      - name: Seuil de couverture (> 95 %)
        run: python3 tool/check_coverage.py
